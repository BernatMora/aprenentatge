<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catàleg de pràctica · BernatLab</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e222b; --text:#e8eaed;
    --muted:#9aa3af; --accent:#f0b429; --accent2:#7dd3fc; --border:#2a2f3a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .embolcall{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
  h1{margin:0 0 4px;font-size:1.6rem;color:var(--accent)}
  .sub{color:var(--muted);margin:0 0 18px;font-size:.95rem}
  .targeta{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  input,select{background:var(--card2);color:var(--text);border:1px solid var(--border);
    border-radius:9px;padding:10px 12px;font-size:.95rem;outline:none}
  input{flex:1 1 260px;min-width:180px}
  input:focus,select:focus{border-color:var(--accent2)}
  .pastilles{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .pastilla{background:var(--card2);border:1px solid var(--border);border-radius:999px;
    padding:5px 11px;font-size:.83rem;cursor:pointer;color:var(--muted)}
  .pastilla.activa{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:600}
  .comptes{color:var(--muted);font-size:.9rem;margin:14px 0 8px}
  .comptes b{color:var(--accent2)}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:.8rem;
     text-transform:uppercase;letter-spacing:.04em;padding:8px 6px;border-bottom:1px solid var(--border)}
  td{padding:7px 6px;border-bottom:1px solid #232833;vertical-align:top}
  tr:hover td{background:#1b1f27}
  .nom{color:var(--text)}
  .carpeta{color:var(--muted);font-size:.8rem}
  .et{display:inline-block;padding:1px 7px;border-radius:6px;font-size:.75rem;font-weight:600}
  .t-audio{background:#1f3a2a;color:#8ee6a8}
  .t-video{background:#3a2340;color:#e3a8f5}
  .t-guitarpro{background:#3a2f1a;color:#f0c674}
  .t-pdf{background:#3a1f22;color:#f5a3a3}
  .t-imatge{background:#1f323a;color:#8fd8f0}
  .t-biab{background:#26303a;color:#a8c8e8}
  .t-altre{background:#2a2f3a;color:var(--muted)}
  .mida{text-align:right;color:var(--muted);white-space:nowrap}
  .avis{color:var(--muted);font-size:.85rem;margin-top:12px;text-align:center}
  a{color:var(--accent2)}
</style>
</head>
<body>
<div class="embolcall">
  <h1>🎸 Catàleg de pràctica</h1>
  <p class="sub" id="capcalera">Carregant l'índex…</p>

  <div class="targeta">
    <div class="controls">
      <input id="cerca" type="search" placeholder="Cerca per nom… (prova: blues, jam in E, SRV, backing)">
      <select id="filtreGrup"><option value="">Tots els grups</option></select>
      <select id="ordre">
        <option value="nom">Ordena per nom</option>
        <option value="mida">Ordena per mida</option>
        <option value="grup">Ordena per grup</option>
      </select>
    </div>
    <div class="pastilles" id="pastilles"></div>
  </div>

  <div class="comptes" id="comptes"></div>
  <div class="targeta" style="padding:0;overflow:hidden">
    <table>
      <thead><tr><th>Nom</th><th>Carpeta</th><th>Tipus</th><th class="mida">Mida</th></tr></thead>
      <tbody id="cos"></tbody>
    </table>
  </div>
  <p class="avis" id="avis"></p>
</div>

<script>
const MAX = 400;           // files que es pinten de cop
let D = null, items = [], tipusActiu = "";

const fmt = b => b >= 1073741824 ? (b/1073741824).toFixed(2)+" GB"
              : b >= 1048576    ? (b/1048576).toFixed(1)+" MB"
              : b >= 1024       ? (b/1024).toFixed(0)+" KB" : b+" B";

fetch("index-practica.json")
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    D = d;
    items = d.items.map(([n,g,t,m,s,c]) => ({n, g:d.grups[g], t:d.tipus[t], m, s, c}));
    document.getElementById("capcalera").textContent =
      "Índex de " + d.n.toLocaleString("ca-ES") + " fitxers · " + fmt(d.total_bytes) +
      " · generat el " + d.generat.slice(0,10) + " · origen: " + d.origen;
    const sel = document.getElementById("filtreGrup");
    d.grups.forEach(g => { const o = document.createElement("option"); o.value = g; o.textContent = g; sel.appendChild(o); });
    const cnt = {};
    items.forEach(i => cnt[i.t] = (cnt[i.t]||0)+1);
    const ordre = ["audio","video","guitarpro","pdf","biab","imatge","paquet","text"];
    const past = document.getElementById("pastilles");
    ordre.filter(t => cnt[t]).forEach(t => {
      const b = document.createElement("span");
      b.className = "pastilla"; b.dataset.t = t; b.textContent = t + " (" + cnt[t].toLocaleString("ca-ES") + ")";
      past.appendChild(b);
    });
    const tot = document.createElement("span");
    tot.className = "pastilla activa"; tot.dataset.t = ""; tot.textContent = "tot";
    past.insertBefore(tot, past.firstChild);
    past.addEventListener("click", e => {
      const p = e.target.closest(".pastilla"); if(!p) return;
      document.querySelectorAll(".pastilla").forEach(x => x.classList.remove("activa"));
      p.classList.add("activa"); tipusActiu = p.dataset.t; pinta();
    });
    document.getElementById("cerca").addEventListener("input", pinta);
    sel.addEventListener("change", pinta);
    document.getElementById("ordre").addEventListener("change", pinta);
    pinta();
  })
  .catch(e => {
    document.getElementById("capcalera").textContent = "No he pogut carregar l'índex (" + e.message + ")";
  });

function pinta(){
  if(!D) return;
  const q = document.getElementById("cerca").value.trim().toLowerCase();
  const g = document.getElementById("filtreGrup").value;
  const ord = document.getElementById("ordre").value;
  let r = items.filter(i =>
      (!tipusActiu || i.t === tipusActiu) &&
      (!g || i.g === g) &&
      (!q || i.n.toLowerCase().includes(q) || (i.s && i.s.toLowerCase().includes(q))));
  if (ord === "mida") r.sort((a,b) => b.m - a.m);
  else if (ord === "grup") r.sort((a,b) => a.g.localeCompare(b.g) || a.n.localeCompare(b.n));
  else r.sort((a,b) => a.n.localeCompare(b.n));
  const bytes = r.reduce((s,i) => s + i.m, 0);
  document.getElementById("comptes").innerHTML =
    "<b>" + r.length.toLocaleString("ca-ES") + "</b> fitxers · <b>" + fmt(bytes) + "</b>" +
    (r.length > MAX ? " · es mostren els primers " + MAX : "");
  const cos = document.getElementById("cos");
  cos.innerHTML = "";
  r.slice(0, MAX).forEach(i => {
    const tr = document.createElement("tr");
    const cls = ["audio","video","guitarpro","pdf","imatge","biab"].includes(i.t) ? "t-"+i.t : "t-altre";
    tr.innerHTML = '<td class="nom">' + esc(i.n) + '</td>' +
      '<td class="carpeta">' + esc(i.g) + (i.s ? " › " + esc(i.s) : "") + (i.c ? ' <span title="nomes al nuvol">☁</span>' : '') + '</td>' +
      '<td><span class="et ' + cls + '">' + i.t + '</span></td>' +
      '<td class="mida">' + fmt(i.m) + '</td>';
    cos.appendChild(tr);
  });
  document.getElementById("avis").textContent = r.length > MAX
    ? "Refina la cerca o els filtres per veure'n més." : "";
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
</script>
</body>
</html>
